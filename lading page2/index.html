<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodman - Website</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav__header">
            <div class="nav__logo">
                <a href="#">Food<span>man</span></a>
            </div>
            <div class="nav__menu__btn" id="menu-btn">
                <span><i class="ri-menu-line"></i></span>
            </div>
        </div>
        <ul class="nav__links" id="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#special">Special</a></li>
            <li><a href="#chef">Chef</a></li>
            <li><a href="#client">Client</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <div class="nav__btn">
            <button class="btn"><i class="ri-shopping-bag-fill"></i></button>
        </div>
    </nav>

    <header class="section__container header__container" id="home">
        <div class="header__image">
            <img src="assets/header.png" alt="header image">
        </div>
        <div class="header__content">
            <h1>Enjoy the <span>True Test</span> of food.</h1>
            <p class="section__description">
                Explora los mejores sabores de la ciudad con ingredientes frescos y recetas tradicionales.
            </p>
            <div class="header__btn">
                <button class="btn">Get Started</button>
            </div>
        </div>
    </header>

    <script src="main.js"></script>
</body>
</html>

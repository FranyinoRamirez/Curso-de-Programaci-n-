<style>
    :root {
        --color-fondo: #e9e7e7;
        --color-texto: #1a1a1a;
        --color-acento: #D4AF37;
        --fuente-principal: 'Lato', sans-serif;
        --transicion: 0.4s ease;
    }
    body.dark-mode {
        --color-fondo: #121212;
        --color-texto: #CED6E0;
        --color-acento: #f1c40f;
    }
    body {
        background-color: var(--color-fondo);
        color: var(--color-texto);
        font-family: var(--fuente-principal);
        transition: background-color var(--transicion), color var(--transicion);
        margin: 0;
        padding: 50px;
        text-align: center;
    }
    h1 {
        color: var(--color-acento);
    }
    .caja-poetica {
        border: 2px solid var(--color-acento);
        padding: 20px;
        border-radius: 10px;
        background-color: rgba(212, 175, 55, 0.05);
    }
    .btn-toggle {
        padding: 10px 20px;
        background-color: var(--color-acento);
        color: #000;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-bottom: 20px;
    }
</style>

<body>
    <button class="btn-toggle" onclick="document.body.classList.toggle('dark-mode')">
        🌓 TEMA
    </button>

    <div class="caja-poetica">
        <h1>Tus poesias</h1>
        <p>a</p>
    </div>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentacion con estilo</title>
</head>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }
        main {
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: #d4af37;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: #bfa100;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-top: 40px;
        }
        p {
            text-align: justify;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .subtitle {
            text-align: center;
            font-style: italic;
            color: #888;
            margin-top: -10px;
        }
        nav {
            background-color: #111; 
            width: 100%;
            padding: 20px 0;
            border-bottom: 2px solid #d4af37; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .separator {
            text-align: center;
            color: #d4af37;
            font-size: 2rem;
            margin: 40px 0;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
                nav li {
            margin: 0 25px;
        }
        nav a {
            text-decoration: none;
            color: #e0e0e0; 
            font-family: 'Playfair Display', serif; 
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            position: relative;
        }
        nav a:hover {
            color: #d4af37;
        }
        nav a::after {
            content: '';
            display: block;
            width: 0;
            height: 2px;
            background: #d4af37;
            transition: width .3s;
            position: absolute;
            bottom: -5px;
        }
    </style>
<body>
        <nav>
        <ul>
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#poemas">Poesía</a></li>
            <li><a href="#biografia">Biografía</a></li>
            <li><a href="#contacto">Contacto</a></li>
        </ul>
    </nav>
          <header>
            <h1>Bienvenido al Mundo Poetico</h1>
            <p class="subtitle">Las secciones para descubrir la magia de las letras.</p>
        </header>
</body>
</html>

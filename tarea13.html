<style>
    .grid-container {
        display: grid;
        height: 100vh;
        gap: 15px;
        padding: 15px;
        background-color: #121212;
        font-family: 'Lato', sans-serif;
        grid-template-areas: 
            "header  header  header"
            "content content sidebar"
            "footer  footer  footer";
        grid-template-columns: 1fr 1fr 300px;
        grid-template-rows: auto 1fr auto;
    }
    header  { grid-area: header; background-color: #111; border: 1px solid #D4AF37; }
    main    { grid-area: content; background-color: #1e272e; }
    aside   { grid-area: sidebar; background-color: #1a1a1a; border-left: 2px solid #333; }
    footer  { grid-area: footer; background-color: #000; color: #D4AF37; }
    .grid-item {
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 8px;
        padding: 20px;
        color: #CED6E0;
        font-weight: bold;
    }

    h2 { color: #D4AF37; font-family: 'Playfair Display', serif; }
    @media (max-width: 768px) {
        .grid-container {
            grid-template-areas: 
                "header"
                "content"
                "sidebar"
                "footer";
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="grid-container">
    <header class="grid-item">
        <h2>(Logo & Menú)</h2>
    </header>

    <main class="grid-item">
        <div style="text-align: center;">
            <h2>Contenido Principal</h2>
            <p></p>
        </div>
    </main>

    <aside class="grid-item">
        <div style="text-align: center;">
            <h3>Sidebar</h3>
            <p>Links | categorías | redes sociales |</p>
        </div>
    </aside>

    <footer class="grid-item">
        <p>&copy; 2026 Yino Wrld - Todos los derechos reservados</p>
    </footer>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentacion con estilo</title>
</head>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }
        main {
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: #d4af37;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: #bfa100;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-top: 40px;
        }
        p {
            text-align: justify;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .subtitle {
            text-align: center;
            font-style: italic;
            color: #888;
            margin-top: -10px;
        }
        nav {
            background-color: #111; 
            width: 100%;
            padding: 20px 0;
            border-bottom: 2px solid #d4af37; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .separator {
            text-align: center;
            color: #d4af37;
            font-size: 2rem;
            margin: 40px 0;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
                nav li {
            margin: 0 25px;
        }
        nav a {
            text-decoration: none;
            color: #e0e0e0; 
            font-family: 'Playfair Display', serif; 
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            position: relative;
        }
        nav a:hover {
            color: #d4af37;
        }
        nav a::after {
            content: '';
            display: block;
            width: 0;
            height: 2px;
            background: #d4af37;
            transition: width .3s;
            position: absolute;
            bottom: -5px;
        }
        .galeria {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
        padding: 40px 20px;
        align-items: flex-start;
        }
        figure {
        background-color: #222;
        margin: 0;
        padding: 10px;
        border: 1px solid #d4af37;
        border-radius: 8px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
        transition: transform 0.3s ease;
        max-width: 300px;
        }

        figure:hover {
        transform: translateY(-10px); 
        }
        figure img {
        width: 100%;
        height: auto;
        border-radius: 4px;
        display: block;
        }
        figcaption {
        text-align: center;
        font-style: italic;
        color: #d4af37;
        margin-top: 10px;
        font-family: 'Playfair Display', serif;
        font-size: 0.9rem;
        }
            .cta-container {
        text-align: center;
        padding: 50px 0;
    }


    .btn-poetico {
        padding: 15px 40px;
        display: inline-block;
        border-radius: 50px;
        background-color: #d4af37;
        color: #1a1a1a; 
        text-decoration: none; 
        font-family: 'Lato', sans-serif;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.4s ease;
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }
    .btn-poetico:hover {
        background-color: #f1c40f;
        transform: scale(1.05);    
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        color: #000;
    }
    </style>
<body>
        <nav>
        <ul>
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#poemas">Poesía</a></li>
            <li><a href="#biografia">Biografía</a></li>
            <li><a href="#contacto">Contacto</a></li>
        </ul>
    </nav>
          <header>
            <h1>Bienvenido al Mundo Poetico</h1>
            <p class="subtitle">Las secciones para descubrir la magia de las letras.</p>
        </header>
<section id="poemas">
        <h2>Mis Poemas Favoritos</h2>
            <div class="galeria">
        <figure>
            <img src="https://scontent.fmar1-1.fna.fbcdn.net/v/t39.30808-6/622065262_3364020370441197_1235968901380829004_n.jpg?_nc_cat=106&ccb=1-7&_nc_sid=127cfc&_nc_ohc=ml74oX4Aeb4Q7kNvwHN1yYA&_nc_oc=Adm4O23Ko5X4-Rd1U1o04slSJMR4a6Wtvt5X3jLfz8bedqW1uUnaeMID0pPTKSTfy10&_nc_zt=23&_nc_ht=scontent.fmar1-1.fna&_nc_gid=z9WC77vu8CQmB_Eqby2NAg&oh=00_AfsGieFKTuvteOxzlxRtn7HFO3d3rv1I76EJSryOcydZfA&oe=6986A65A" alt="Poeta">
            <figcaption>El inicio de todo verso.</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1516410529446-2c777cb7366d?q=80&w=500" alt="Libro antiguo">
            <figcaption>Memorias de una tinta eterna.</figcaption>
        </figure>

        <figure>
            <img src="https://scontent.fmar7-1.fna.fbcdn.net/v/t39.30808-6/574580499_3277470172429551_3008654638469417130_n.jpg?_nc_cat=100&ccb=1-7&_nc_sid=127cfc&_nc_ohc=6Rc3oYP03P4Q7kNvwETj8BT&_nc_oc=AdmpbGm2T_cXI7VJs2juYlctLLgD0PKJcoo9auLKMpo6PchT_ylQ4SlqfqoDE11AEUc&_nc_zt=23&_nc_ht=scontent.fmar7-1.fna&_nc_gid=OZalPF5aMLsUg3gKcWIMLA&oh=00_AfscbP1BaVw-8LuLinrIuf6Eh5Yb3opbNsc4rlr4gtzs_g&oe=6986A0B0" alt="El espectador">
            <figcaption>El espectador de tu vida</figcaption>
        </figure>
    </div>
    </section>
    <div class="cta-container">
    <p style="color: #d4af37; font-style: italic;"class="subtitle">¿Te ha gustado mi obra?</p>
    <a href="#contacto" class="btn-poetico">¡Escríbeme un Verso!</a>
</div>
</body>
</html>
